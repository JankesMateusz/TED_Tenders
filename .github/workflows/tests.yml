name: Tests

# Testy uruchamiane na PR-ach do develop i main oraz wywoływane przez workflow wdrożeniowy.
on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Emulatory Firebase (reguły Firestore, funkcje) wymagają Javy.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Unit tests
        run: npm run test:unit

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Functions integration tests
        run: npm run test:functions

      - name: Frontend tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: 'true'
